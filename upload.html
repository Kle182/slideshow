<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Enviar Imagens</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border-radius: 20px; padding: 40px; max-width: 500px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
  p.sub { color: #888; margin-bottom: 25px; font-size: 14px; }
  .dropzone { border: 3px dashed #764ba2; border-radius: 15px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s; color: #764ba2; }
  .dropzone:hover, .dropzone.dragover { background: #f5f0ff; border-color: #667eea; }
  .dropzone input { display: none; }
  .dropzone .icon { font-size: 48px; margin-bottom: 10px; }
  .preview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
  .preview .item { position: relative; }
  .preview img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; }
  .preview .tamanho { position: absolute; bottom: 4px; left: 4px; right: 4px; background: rgba(0,0,0,0.7); color: #fff; font-size: 10px; padding: 2px 4px; border-radius: 4px; text-align: center; }
  button { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; display: none; }
  .msg.ok { background: #d4edda; color: #155724; display: block; }
  .msg.err { background: #f8d7da; color: #721c24; display: block; }
  .progresso { margin-top: 10px; font-size: 12px; color: #666; text-align: center; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>📸 Enviar Imagens</h1>
  <p class="sub">As imagens são salvas diretamente no banco.</p>
  <label class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div class="icon">⬆️</div>
    <div><strong>Clique ou arraste imagens aqui</strong></div>
  </label>
  <div class="preview" id="preview"></div>
  <button id="btnEnviar" disabled>Enviar para Apresentação</button>
  <div class="msg" id="msg"></div>
  <div class="progresso" id="progresso"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

// 🔴 SUA CONFIGURAÇÃO APLICADA AQUI
const firebaseConfig = {
  apiKey: "AIzaSyAn-4AVHxNfBPFZUXsPMXm1Ac6GBvoCgUc",
  authDomain: "teste-1047e.firebaseapp.com",
  projectId: "teste-1047e",
  storageBucket: "teste-1047e.firebasestorage.app",
  messagingSenderId: "555293840477",
  appId: "1:555293840477:web:7cbb643971ebe69954a9b4"
};

const LIMITE_BYTES = 900 * 1024;
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const fileInput = document.getElementById('fileInput');
const dropzone = document.getElementById('dropzone');
const preview = document.getElementById('preview');
const btnEnviar = document.getElementById('btnEnviar');
const msg = document.getElementById('msg');
const progresso = document.getElementById('progresso');

let arquivosSelecionados = [];

async function comprimirParaBase64(file) {
  const bitmap = await createImageBitmap(file).catch(async () => {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  });

  const tentativas = [
    { maxLado: 1280, qualidade: 0.72 },
    { maxLado: 1000, qualidade: 0.65 },
    { maxLado: 800,  qualidade: 0.6 },
    { maxLado: 640,  qualidade: 0.5 }
  ];

  for (const t of tentativas) {
    const escala = Math.min(1, t.maxLado / Math.max(bitmap.width, bitmap.height));
    const w = Math.round(bitmap.width * escala);
    const h = Math.round(bitmap.height * escala);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
    const dataURL = canvas.toDataURL('image/jpeg', t.qualidade);
    const bytes = Math.ceil((dataURL.length - dataURL.indexOf(',') - 1) * 0.75);
    if (bytes <= LIMITE_BYTES) return { dataURL, bytes };
  }
  return { dataURL: canvas.toDataURL('image/jpeg', 0.5), bytes: LIMITE_BYTES };
}

function formatarTamanho(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

async function tratarArquivos(files) {
  const lista = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (lista.length === 0) return;
  mostrarMsg('Comprimindo imagens...', 'ok');
  btnEnviar.disabled = true;
  arquivosSelecionados = [];
  preview.innerHTML = '';

  for (const file of lista) {
    try {
      const { dataURL, bytes } = await comprimirParaBase64(file);
      arquivosSelecionados.push({ file, dataURL, bytes });
      const item = document.createElement('div');
      item.className = 'item';
      const img = document.createElement('img'); img.src = dataURL;
      const tam = document.createElement('div'); tam.className = 'tamanho';
      const reducao = file.size > 0 ? Math.round((1 - bytes / file.size) * 100) : 0;
      tam.textContent = `${formatarTamanho(file.size)} → ${formatarTamanho(bytes)} (-${reducao}%)`;
      item.appendChild(img); item.appendChild(tam); preview.appendChild(item);
    } catch (err) { console.error(err); }
  }
  btnEnviar.disabled = arquivosSelecionados.length === 0;
  if (arquivosSelecionados.length > 0) mostrarMsg(`${arquivosSelecionados.length} imagem(ns) pronta(s).`, 'ok');
}

fileInput.addEventListener('change', e => tratarArquivos(e.target.files));
['dragover','dragleave','drop'].forEach(ev => {
  dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.toggle('dragover', ev === 'dragover'); });
});
dropzone.addEventListener('drop', e => tratarArquivos(e.dataTransfer.files));

btnEnviar.addEventListener('click', async () => {
  if (arquivosSelecionados.length === 0) return;
  btnEnviar.disabled = true; btnEnviar.textContent = 'Enviando...';
  progresso.style.display = 'block';

  try {
    let i = 0;
    for (const item of arquivosSelecionados) {
      i++; progresso.textContent = `Enviando ${i}/${arquivosSelecionados.length}...`;
      await addDoc(collection(db, "slides"), {
        url: item.dataURL,
        nome: item.file.name,
        exibicoes: 0,
        criadoEm: Date.now(),
        tamanho: item.bytes
      });
    }
    progresso.style.display = 'none';
    mostrarMsg(`✅ ${arquivosSelecionados.length} imagem(ns) enviada(s)!`, 'ok');
    arquivosSelecionados = []; preview.innerHTML = ''; fileInput.value = '';
  } catch (err) {
    console.error(err);
    progresso.style.display = 'none';
    mostrarMsg('Erro ao enviar.', 'err');
  } finally {
    btnEnviar.textContent = 'Enviar para Apresentação';
    btnEnviar.disabled = arquivosSelecionados.length === 0;
  }
});

function mostrarMsg(texto, tipo) {
  msg.textContent = texto; msg.className = 'msg ' + tipo;
  if (tipo === 'ok' && !texto.includes('Comprimindo')) setTimeout(() => { msg.className = 'msg'; }, 3000);
}
</script>
</body>
</html>
