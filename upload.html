<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Enviar Imagem</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    overflow-x: hidden;
  }
  .card {
    background: #fff; border-radius: 20px;
    padding: 28px 20px;
    max-width: 480px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 {
    color: #333; margin-bottom: 6px;
    font-size: clamp(20px, 5vw, 24px);
  }
  p.sub {
    color: #888; margin-bottom: 20px;
    font-size: clamp(12px, 3.5vw, 14px);
    line-height: 1.4;
  }

  /* 🌟 ALTERAÇÃO AQUI: Mudamos para 1 coluna para o botão ficar largo */
  .acoes {
    display: grid;
    grid-template-columns: 1fr; 
    gap: 10px;
    margin-bottom: 16px;
  }
  
  .btn-acao {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    padding: 18px 10px;
    border: 3px dashed #764ba2;
    border-radius: 15px;
    background: transparent;
    color: #764ba2;
    cursor: pointer;
    font-size: clamp(14px, 4vw, 16px); /* Fonte um pouco maior já que agora ocupa a tela toda */
    font-weight: 600;
    transition: all 0.2s;
    user-select: none;
    -webkit-user-select: none;
    min-height: 120px; /* Altura maior para facilitar o toque */
  }
  .btn-acao:active, .btn-acao:hover {
    background: #f5f0ff;
    border-color: #667eea;
    transform: scale(0.98);
  }
  .btn-acao .icon { font-size: 42px; line-height: 1; margin-bottom: 8px; }
  .btn-acao input { display: none; }

  .preview-box {
    margin-top: 6px;
    border-radius: 12px;
    overflow: hidden;
    display: none;
    position: relative;
    background: #000;
  }
  .preview-box.ativo { display: block; }
  .preview-box img {
    width: 100%;
    max-height: 320px;
    object-fit: contain;
    display: block;
  }
  .preview-info {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 12px;
    gap: 8px;
  }
  .preview-info .reducao { color: #4ade80; font-weight: 600; }
  .btn-remover {
    background: #e74c3c;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
  }

  .btn-enviar {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border: none;
    border-radius: 12px;
    font-size: clamp(15px, 4vw, 16px);
    font-weight: bold;
    cursor: pointer;
    margin-top: 16px;
    transition: transform 0.2s;
    min-height: 52px;
  }
  .btn-enviar:active { transform: scale(0.98); }
  .btn-enviar:disabled { opacity: 0.5; cursor: not-allowed; }

  .msg {
    margin-top: 14px; padding: 12px;
    border-radius: 10px; text-align: center;
    font-size: clamp(12px, 3.5vw, 14px);
    display: none;
    line-height: 1.4;
  }
  .msg.ok  { background: #d4edda; color: #155724; display: block; }
  .msg.err { background: #f8d7da; color: #721c24; display: block; }
  .msg.info{ background: #d1ecf1; color: #0c5460; display: block; }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <h1>📸 Enviar Imagem</h1>
  <p class="sub">Tire uma foto agora. Ela será exibida na apresentação  Para Exibir no telão. formatura 5ª Ano 2026  EMEF Professor João Cardoso de Siqueira Primo</p>


  <div class="acoes">
    <!-- 🌟 ALTERAÇÃO AQUI: Botão da Galeria comentado -->
    <!--
    <label class="btn-acao" for="inputGaleria">
      <span class="icon">🖼️</span>
      <span>Galeria</span>
      <input type="file" id="inputGaleria" accept="image/*">
    </label>
    -->

    <!-- Botão da Câmera ficou ativo e ocupando todo o espaço -->
    <label class="btn-acao" for="inputCamera">
      <span class="icon">📷</span>
      <span>Tirar Foto</span>
      <!-- capture="environment" abre a câmera traseira no celular -->
      <input type="file" id="inputCamera" accept="image/*" capture="environment">
    </label>
  </div>

  <div class="preview-box" id="previewBox">
    <img id="previewImg" alt="Prévia">
    <div class="preview-info">
      <span id="previewTamanho"></span>
      <button class="btn-remover" id="btnRemover" type="button">Remover</button>
    </div>
  </div>

  <button class="btn-enviar" id="btnEnviar" disabled>Enviar para Apresentação</button>
  <div class="msg" id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAn-4AVHxNfBPFZUXsPMXm1Ac6GBvoCgUc",
  authDomain: "teste-1047e.firebaseapp.com",
  projectId: "teste-1047e",
  storageBucket: "teste-1047e.firebasestorage.app",
  messagingSenderId: "555293840477",
  appId: "1:555293840477:web:7cbb643971ebe69954a9b4"
};

const LIMITE_BYTES = 900 * 1024;
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🌟 ALTERAÇÃO AQUI: inputGaleria foi removido daqui
// const inputGaleria = document.getElementById('inputGaleria');
const inputCamera  = document.getElementById('inputCamera');
const previewBox   = document.getElementById('previewBox');
const previewImg   = document.getElementById('previewImg');
const previewTam   = document.getElementById('previewTamanho');
const btnRemover   = document.getElementById('btnRemover');
const btnEnviar    = document.getElementById('btnEnviar');
const msg          = document.getElementById('msg');

let selecionado = null;

async function comprimirParaBase64(file) {
  const bitmap = await createImageBitmap(file).catch(async () => {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  });

  const tentativas = [
    { maxLado: 1280, qualidade: 0.72 },
    { maxLado: 1000, qualidade: 0.65 },
    { maxLado: 800,  qualidade: 0.6 },
    { maxLado: 640,  qualidade: 0.5 }
  ];

  let ultimo = null;
  for (const t of tentativas) {
    const escala = Math.min(1, t.maxLado / Math.max(bitmap.width, bitmap.height));
    const w = Math.round(bitmap.width * escala);
    const h = Math.round(bitmap.height * escala);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
    const dataURL = canvas.toDataURL('image/jpeg', t.qualidade);
    const bytes = Math.ceil((dataURL.length - dataURL.indexOf(',') - 1) * 0.75);
    ultimo = { dataURL, bytes };
    if (bytes <= LIMITE_BYTES) return ultimo;
  }
  return ultimo;
}

function formatarTamanho(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

async function processarArquivo(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    mostrarMsg('Apenas imagens são permitidas.', 'err');
    return;
  }

  selecionado = null;
  previewBox.classList.remove('ativo');
  btnEnviar.disabled = true;

  mostrarMsg('Processando imagem...', 'info');

  try {
    const { dataURL, bytes } = await comprimirParaBase64(file);
    selecionado = { file, dataURL, bytes };

    previewImg.src = dataURL;
    const reducao = file.size > 0 ? Math.round((1 - bytes / file.size) * 100) : 0;
    previewTam.innerHTML = `${formatarTamanho(file.size)} → <span class="reducao">${formatarTamanho(bytes)} (-${reducao}%)</span>`;
    previewBox.classList.add('ativo');
    btnEnviar.disabled = false;

    esconderMsg();
  } catch (err) {
    console.error(err);
    mostrarMsg('Falha ao processar imagem.', 'err');
  }
}

// 🌟 ALTERAÇÃO AQUI: Listener da galeria comentado
/*
inputGaleria.addEventListener('change', e => {
  processarArquivo(e.target.files[0]);
  e.target.value = ''; 
});
*/

inputCamera.addEventListener('change', e => {
  processarArquivo(e.target.files[0]);
  e.target.value = '';
});

btnRemover.addEventListener('click', () => {
  selecionado = null;
  previewBox.classList.remove('ativo');
  previewImg.src = '';
  btnEnviar.disabled = true;
  esconderMsg();
});

btnEnviar.addEventListener('click', async () => {
  if (!selecionado) return;

  btnEnviar.disabled = true;
  btnEnviar.innerHTML = '<span class="spinner"></span>Enviando...';

  try {
    await addDoc(collection(db, "slides"), {
      url: selecionado.dataURL,
      nome: selecionado.file.name || 'foto.jpg',
      exibicoes: 0,
      ativo: true,
      criadoEm: Date.now(),
      tamanho: selecionado.bytes
    });

    mostrarMsg('✅ Imagem enviada! Ela já está na apresentação.', 'ok');

    selecionado = null;
    previewBox.classList.remove('ativo');
    previewImg.src = '';
  } catch (err) {
    console.error(err);
    mostrarMsg('Erro ao enviar. Tente novamente.', 'err');
  } finally {
    btnEnviar.innerHTML = 'Enviar para Apresentação';
    btnEnviar.disabled = !selecionado;
  }
});

function mostrarMsg(texto, tipo) {
  msg.textContent = texto;
  msg.className = 'msg ' + tipo;
  if (tipo === 'ok') setTimeout(esconderMsg, 4000);
}
function esconderMsg() {
  msg.className = 'msg';
}
</script>
</body>
</html>
