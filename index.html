<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apresentação de Slides</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; height: 100vh; overflow: hidden; font-family: sans-serif; }
  .slide-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
  .slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 1s ease-in-out; }
  .slide.active { opacity: 1; }
  .slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head>
<body>

<div class="slide-container" id="container"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

// 🔴 SUA CONFIGURAÇÃO DO FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyAn-4AVHxNfBPFZUXsPMXm1Ac6GBvoCgUc",
  authDomain: "teste-1047e.firebaseapp.com",
  projectId: "teste-1047e",
  storageBucket: "teste-1047e.firebasestorage.app",
  messagingSenderId: "555293840477",
  appId: "1:555293840477:web:7cbb643971ebe69954a9b4"
};

// ============================================================
// ⚙️ CONFIGURAÇÕES DA APRESENTAÇÃO (ALTERE AQUI)
// ============================================================

// 1. TEMPO DE EXIBIÇÃO DE CADA FOTO (em milissegundos)
const TEMPO_POR_SLIDE = 5000; // 5000 = 5 segundos

// 2. QUANTAS VEZES CADA FOTO ENVIADA VAI APARECER
const MAX_EXIBICOES = 5; 

// 3. IMAGENS FIXAS
const IMAGENS_FIXAS = [
  "https://picsum.photos/id/1015/1600/900",
  "https://picsum.photos/id/1016/1600/900",
  "https://picsum.photos/id/1018/1600/900"
];

// ============================================================
// LÓGICA DO SISTEMA
// ============================================================
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let imagensEnviadas = [];
let fila = [];
let indiceAtual = 0;
let timer = null;
let slidesDOM = [];

function montarFila() {
  const fixas = IMAGENS_FIXAS.map((url, i) => ({ url, fixa: true, key: 'fixa_' + i }));
  fila = [...fixas, ...imagensEnviadas];
}

function renderizar() {
  const container = document.getElementById('container');
  container.innerHTML = ''; 
  slidesDOM = [];
  
  if (fila.length === 0) { 
    container.innerHTML = '<div style="color:#555;font-size:24px;text-align:center;">Aguardando...</div>'; 
    return; 
  }
  
  fila.forEach(item => {
    const div = document.createElement('div');
    div.className = 'slide';
    const tag = document.createElement('img');
    tag.src = item.url;
    div.appendChild(tag); 
    container.appendChild(div); 
    slidesDOM.push(div);
  });
  
  if (indiceAtual >= fila.length) indiceAtual = 0;
  slidesDOM[indiceAtual].classList.add('active');
}

async function mostrarProximo() {
  if (fila.length === 0 || slidesDOM.length === 0) return;
  const atual = fila[indiceAtual];

  if (!atual.fixa) {
    const novas = (atual.exibicoes || 0) + 1;
    
    if (novas >= MAX_EXIBICOES) {
      // Em vez de deletar, marcamos como INATIVA. 
      // Ela fica salva no Firebase mas sai da apresentação.
      await updateDoc(doc(db, "slides", atual.id), { 
        exibicoes: novas,
        ativo: false 
      });
      return; // O onSnapshot vai reconstruir a tela e remover ela da fila
    } else {
      await updateDoc(doc(db, "slides", atual.id), { exibicoes: novas });
      atual.exibicoes = novas;
    }
  }

  slidesDOM[indiceAtual].classList.remove('active');
  indiceAtual = (indiceAtual + 1) % fila.length;
  slidesDOM[indiceAtual].classList.add('active');
}

function iniciarLoop() {
  if (timer) clearInterval(timer);
  timer = setInterval(mostrarProximo, TEMPO_POR_SLIDE);
}

// Escuta em tempo real o banco de dados
onSnapshot(collection(db, "slides"), (snapshot) => {
  imagensEnviadas = snapshot.docs
    .map(d => ({
      id: d.id, 
      url: d.data().url, 
      exibicoes: d.data().exibicoes || 0,
      ativo: d.data().ativo !== false // Se o campo não existir, assume que é true
    }))
    .filter(img => img.ativo); // 🌟 AQUI: ignora as imagens inativas (limite atingido)

  const urlAtual = fila[indiceAtual]?.url;
  montarFila();
  
  const novoIndice = fila.findIndex(i => i.url === urlAtual);
  indiceAtual = novoIndice >= 0 ? novoIndice : 0;
  
  renderizar();
  
  if (!timer) iniciarLoop();
});
</script>
</body>
</html>
